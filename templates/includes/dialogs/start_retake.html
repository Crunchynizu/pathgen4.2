{# Dialog 10: Start your one retake (docs/modals.md). #}
<dialog id="dialog-retake" class="dialog" aria-labelledby="dialog-retake-title">
  <form method="post" action="{% url 'practice:start' exercise.id %}">
    {% csrf_token %}
    <input type="hidden" name="retake" value="1">
    <div class="dialog-head">
      <h2 id="dialog-retake-title">Start your one retake?</h2>
      <button type="button" class="dialog-x" data-dialog-close aria-label="Close">×</button>
    </div>
    <div class="dialog-body">
      <p>This is your second and last time with this practice: {{ revision.target_count }} questions, mostly ones you haven't seen. Your first result stays saved.</p>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" data-dialog-close>Not now</button>
      <button type="submit" class="btn btn-primary" data-once>Start the retake</button>
    </div>
  </form>
</dialog>
